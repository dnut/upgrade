# upgrade packages installed from the AUR using an AUR helper
upgrade_aur=true

# upgrade packages installed by flatpak
upgrade_flatpak=true

# after running the upgrade, remove old packages from pacman's cache, keeping the
# two most recent versions of each package, and delete paru's build files
clean_cache_on_success=true

# remove unneeded dependencies after running the upgrade.
# this is deliberately conservative and does not touch
# packages that are still optional dependencies.
autoremove=true
