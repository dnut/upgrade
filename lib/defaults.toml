# the default for each option. don't change this file, it's replaced on upgrade. to change an option,
# set it in /etc/upgrade.toml instead, which overrides this.

# upgrade packages installed from the AUR using an AUR helper. see "AUR packages" in the README first.
upgrade_aur = false

# upgrade packages installed by flatpak
upgrade_flatpak = true

# after running the upgrade, remove old packages from pacman's cache, keeping the
# two most recent versions of each package, and delete the AUR build files
clean_cache_on_success = true

# remove unneeded dependencies after running the upgrade.
# this is deliberately conservative and does not touch
# packages that are still optional dependencies.
autoremove = true

# stop upgrading packages while there's Arch Linux news that hasn't been acknowledged with
# upgrade ack, since some posts announce manual steps needed before or after an upgrade
block_on_news = true

# how to tell admins about notices, which are what runs leave for them to read or handle. see
# "Notices" in the README. motd shows them at console and ssh logins, shell in login shells of root,
# wheel and upgraders, wall on the terminals of everyone logged in, and desktop as notifications.
notifications = ["motd", "shell", "wall", "desktop"]
